- id: bes-schema-validate
  name: Validate BigFix BES Files
  description: This hook validates BigFix BES XML Files against the BES.xsd schema
  entry: bes-schema-validate
  language: python
  pass_filenames: True
  types: [text]
  files: \.(bes|ojo)$
