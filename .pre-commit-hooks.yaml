- id: bes-actionscript-lint-schclass
  name: Lint BigFix ActionScript against the schclass grammar
  description: >
    Lints every <ActionScript> body in BES files against the BigFix console's
    own lexical grammar (the vendored ExpandedActionScript.schclass plus a
    small validation override): the first token of every line must be a known
    command verb, a // comment, a {...} substitution, a continuation, or the
    line must be blank (E300); a {...} substitution must close before line end
    (E301); a `createfile until <MARKER>` block must reach its marker line
    (E302, with the block's raw content excluded from linting); and an
    `override run` / `override wait` block's keyword=value option lines must
    use the documented keywords and values (E303), a {...} value being a
    relevance substitution and accepted unchecked. Verbs match
    case-insensitively, but a non-lowercase verb warns (W302); an override
    option keyword or value that is not lowercase warns (W303); an unbalanced
    " warns (W301). Only application/x-Fixlet-Windows-Shell (or missing
    MIMEType) bodies are BigFix ActionScript and are linted. Bodies are
    extracted with lxml, so entities are decoded, CDATA sections merged, and
    line numbers map back to the file. Unparsable files are skipped
    (bes-schema-validate owns validity). Scope is limited to what the grammar
    can decide -- lexical validity per line -- plus the two block constructs it
    cannot express (createfile heredocs, override option blocks); argument
    shapes, if/endif pairing, the closing-tag whitespace trap, and auto-fixes
    belong in a sibling ActionScript hook. E-codes fail the hook; pass --strict to also fail on
    warnings. Widen `files` to lint raw ActionScript text files too.
  language: python
  pass_filenames: True
  entry: bes-actionscript-lint-schclass
  types: [text]
  files: \.bes$
- id: bes-actionscript-validate-prefetch
  name: Validate BigFix prefetch lines in ActionScript
  description: >
    Validates every prefetch line in every <ActionScript> body of a BES file
    with validate_prefetch() from the bigfix_prefetch package, the reference
    implementation of what a valid prefetch is. Both spellings are covered:
    the `prefetch <name> sha1:<40> size:<n> <url> sha256:<64>` statement and
    the `add prefetch item name=... sha1=... size=... url=... sha256=...`
    block item. A line that fails validation is E400, carrying the reason
    bigfix_prefetch reported (size missing or not > 0, a hash of the wrong
    length, an unparsable line). A missing sha256 is E401: upstream treats
    sha256 as optional, this hook
    treats it as mandatory, and it is its own code so a repo that still wants
    it optional can pass --disable E401, and --auto-fix-network adds the
    missing sha256 instead of reporting it (see below). A prefetch downloading
    the retired unzip-5.52.exe from the BigFix redist folder is E402, and is
    this hook's offline auto-fix: with --auto-fix (the default when files are
    given, as pre-commit does) the line is rewritten in place to the current
    unzip-6.0.exe prefetch, built by prefetch_from_dictionary() from
    bigfix_prefetch in whichever spelling the line already used and keeping
    the original download's name; an auto-fixed file fails the hook so the
    change is reviewed and re-staged. A prefetch block item with no sha1
    warns (W402); a prefetch statement with no sha1 warns (W405) instead of
    failing the line, since current BigFix clients accept a statement with
    sha256 alone. An `add nohash prefetch item` line is reported rather
    than validated (W403) since it is hashless by definition -- on the old
    URL it is reported but not rewritten, since a hashed prefetch would
    change what the line does. --auto-fix-network, OFF by default, adds the
    missing sha256 of an E401 by DOWNLOADING the file to hash it, via
    add_sha256_prefetch() from bigfix_prefetch (>= 1.1.5), which checks the
    download against the size and sha1 already on the line and re-emits the
    prefetch in the same spelling, keeping the line's own download name; each
    URL is fetched at most once per run, each download gives up after 60
    seconds, and a download that fails or does not match is W404, leaving the
    line and its E401 alone. It is opt-in because it reaches out to whatever
    URLs the content names. A file whose
    prefetches knowingly do not meet these rules opts out of the whole hook
    with `prefetch-ok` anywhere in it -- the same marker that opts out of
    W206 in bes-conventions-check.
    Scope of the checks is internal validity only: they are offline and never
    download a URL or verify that the hashes match the real file (only
    --auto-fix-network does, and only when asked). Dynamic prefetches
    (a line holding a {...} substitution), // comments, and the raw content of
    a `createfile until` block are skipped. Only
    application/x-Fixlet-Windows-Shell (or missing MIMEType) bodies are
    checked; bodies are extracted with lxml, so entities are decoded, CDATA
    sections merged, and line numbers map back to the file. Unparsable files
    are skipped (bes-schema-validate owns validity). E402 and (with
    --auto-fix-network) E401 are the only auto-fixes: E400 depends on the size
    and hashes of the real file, and a hook has no way to know which file was
    meant. E-codes and any auto-fix fail the hook; pass --strict to also fail
    on warnings.
  language: python
  pass_filenames: True
  entry: bes-actionscript-validate-prefetch
  types: [text]
  files: \.bes$
- id: bes-actionscript-validate-script
  name: Validate ActionScript block balance in BES files
  description: >
    Checks every <ActionScript> body of a BES file for balanced `if`/`endif`
    and `begin prefetch block`/`end prefetch block` pairing -- the sibling
    hook named in bes-actionscript-lint-schclass's SCOPE note for checks that
    need pairing, ordering, and block-interleaving knowledge the lexical
    grammar does not carry, and meant to grow more per-script checks over
    time. An unclosed `if` is E500 and a stray `endif` with no open `if` is
    E501; an unclosed `begin prefetch block` is E502 and a stray
    `end prefetch block` is E503; a `begin prefetch block` nested inside
    another one is E504, since prefetch blocks do not nest; an `else` or
    `elseif` outside any open `if` is E505; an `elseif` after `else`, or a
    second `else` for the same `if`, is E506; and an `if` opened inside a
    prefetch block that is still open at that block's `end prefetch block` is
    E507, since blocks interleave rather than nest. Within a single line, a
    `{...}` relevance substitution left unclosed at end of line is E508 and a
    `}` with no substitution open is E509 -- a substitution cannot span lines;
    `{{` (and `}}`) passes a literal brace through rather than opening or
    closing a substitution (the `}}` escape holds inside an open substitution
    too), and a lone `}` pairs with such an escape. An
    `add prefetch item` or `collect prefetch items` outside an open prefetch
    block is E510/E511; two producers declaring the same download name is
    E512 (only within the same conditional context -- declarations in different
    if/elseif/else branches are not compared, since cross-platform content
    declares one name per OS in separate `if`s); a `__Download\<name>`
    reference nothing prefetches or downloads is E513 (skipped whenever any
    producer's names are unknowable -- extract, a `download` with no `as`, or
    a `{...}` in a name; `delete`/`folder delete` are cleanup, and
    `copy`/`move` destinations and `>` redirection targets are producers); an `if`/`elseif`
    whose condition is not a `{...}` substitution is E514; and a
    `begin prefetch block` not at the top of the script (only comments,
    blank lines, `action parameter query`, and `parameter` assignments may
    precede it) is E515 -- plain `prefetch` statements are legal anywhere
    and are not placement-checked. Two `parameter "name" = ...` assignments
    to the same name that can co-execute (the same conditional-context rule
    as E512) is E516, since action parameters are write-once and the second
    assignment silently overwrites the first; a `parameter "name"`
    reference before that name's assignment elsewhere in the body is E517
    (a name never assigned in-script, e.g. a secure parameter from the
    Description page, is not flagged at all). A `continue if` or
    `pause while` condition that is not a `{...}` substitution is E518,
    the same E514 rule extended to those two verbs. A command referencing
    `__createfile` or `__appendfile` with no matching `createfile until` /
    `appendfile` producer anywhere in the body is E519 (the E513 rule
    reapplied, with the same `delete`/`folder delete` cleanup exemption);
    any `__Download`, `__createfile`, or `__appendfile` reference whose case
    does not match exactly warns W503, since Windows tolerates the mismatch
    but a case-sensitive Linux/macOS filesystem does not. A `setting` line
    that is not the documented
    `setting "name"="value" on "{...}" for client|user|action` shape is
    E520; a `regset`/`regset64`/`regdelete`/`regdelete64` key that is not a
    quoted, bracketed `"[HKEY_...]..."` keyname is E521; the deprecated
    `dos` verb warns W504 (use `waithidden cmd.exe /c ...` instead). An
    `override wait` / `override run` block not terminated by its own
    matching verb -- end of body, the other verb's command, or being
    reopened by another `override` first -- is E522: the option lines
    inside a block are bes-actionscript-lint-schclass's E303, this is the
    pairing check that hook's state machine cannot express. A command after
    an unconditional exit/restart/shutdown is unreachable and warns W501; an
    `action parameter query` after execution began warns W502. E-codes
    fail the hook; this hook has no auto-fixes, since a hook has no way to know where a
    missing `endif` or `end prefetch block` was meant to go, and guessing
    could silently change what the action does. Only
    application/x-Fixlet-Windows-Shell (matched case-insensitively) or
    missing-MIMEType bodies are checked; bodies are extracted with lxml, so
    entities are decoded, CDATA sections merged, and line numbers map back to
    the file. Lines inside a `createfile until` block are file content, not
    ActionScript, and are not scanned; that block's own well-formedness is
    bes-actionscript-lint-schclass's E302, not reported here. Unparsable files
    are W500 (bes-schema-validate owns validity). A file opts out of every
    check here with `pre-commit-skip: bes-actionscript-validate-script`
    anywhere in it, or out of one family with `actionscript-if-ok` (E500,
    E501, E505, E506, E514, E518), `actionscript-prefetch-block-ok` (E502,
    E503, E504), `actionscript-block-nesting-ok` (E507),
    `actionscript-substitution-ok` (E508, E509 -- the marker
    bes-actionscript-lint-schclass also uses for its E301),
    `actionscript-prefetch-placement-ok` (E510, E511, E515),
    `actionscript-download-ok` (E512, E513), `actionscript-parameter-ok`
    (E516, E517), `actionscript-scratch-ok` (E519, W503),
    `actionscript-command-shape-ok` (E520, E521, W504),
    `actionscript-override-ok` (E522 -- shared with
    bes-actionscript-lint-schclass's E303), `actionscript-unreachable-ok`
    (W501), or `actionscript-parameter-query-ok` (W502). E-codes fail the
    hook; pass
    --strict to also fail on warnings.
  language: python
  pass_filenames: True
  entry: bes-actionscript-validate-script
  types: [text]
  files: \.bes$
