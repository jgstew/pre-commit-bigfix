[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Put the repo root on sys.path so `from pre_commit_bigfix import ...` resolves
# from source without the package being installed. Without this, running the
# bare `pytest` console script (as the pre-commit pytest hook does, in an
# isolated env where the package is not installed) fails to import the package.
# `python -m pytest` happens to work because -m adds the cwd, which masks this.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = ["tests/"]

[tool.ruff.lint]
# EXE001 (shebang but not executable) is ignored on purpose: the hook
# modules and tests carry `#!/usr/bin/env python3` so they can be run
# directly, but they are imported modules / console_scripts entry
# points, not executables, so the exec bit is deliberately not set.
# SIM103 (return the condition directly) is disabled per James's request.
ignore = ["EXE001", "SIM103"]
