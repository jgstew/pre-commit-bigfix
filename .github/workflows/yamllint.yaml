---
name: yamllint

on:
  push:
    branches:
      - main
    paths:
      - "**.yaml"
      - "**.yml"
  # no paths filter: yamllint is a required check on main, and a PR that
  # changes no YAML would otherwise never report it and could not merge
  pull_request:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint . -f parsable
