---
# Tags, releases and publishes on a version bump. Nothing here bumps the
# version: change `__version__` in pre_commit_bigfix/__init__.py in a PR, merge
# it to main, and this workflow does the rest (build, checksums, tag, GitHub
# Release, and - once deliberately enabled, see the publish job - PyPI).
#
# Four stages, each with only the access it needs:
#   version   decide what is needed (a release? a PyPI upload?); read-only
#   build     wheel + sdist + checksums, uploaded as the `dist` artifact; no
#             write access and no OIDC, so the build backend and its
#             dependencies never run where a PyPI token can be minted
#   release   tag + GitHub release from that artifact; contents: write
#   publish   upload that same artifact to PyPI; id-token: write, and runs
#             nothing but uv
name: Tag and Release

on:
  push:
    branches:
      - main
    paths:
      - "pre_commit_bigfix/__init__.py"
      - ".github/workflows/tag_and_release.yaml"
      - ".github/workflows/test_build.yaml"
  # Re-run path, from main only (see the version job's `if`): finishes a
  # release or a PyPI upload that failed after the version was merged. The
  # checks below make it a no-op when there is nothing left to do.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # deliberately no cancel-in-progress: never kill a release mid-flight
  group: release-${{ github.ref }}

jobs:
  # Decides whether there is anything to do, so the jobs below can be skipped
  # outright. A push that does not bump the version gets a green, near-instant
  # run and no release.
  version:
    name: Check for an unreleased version
    runs-on: ubuntu-latest
    # Fork guard, and main only: workflow_dispatch can be started on any
    # branch, and a dispatched feature branch must not tag or publish code
    # that never went through review.
    if: github.repository == 'jgstew/pre-commit-bigfix' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.getversion.outputs.version }}
      release_needed: ${{ steps.tagged.outputs.release_needed }}
      publish_needed: ${{ steps.pypi.outputs.publish_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history + tags: the tag check below needs every existing tag
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # `__version__` in pre_commit_bigfix/__init__.py is the single source of
      # truth (setup.cfg reads it with `attr:`). It is read with ast rather
      # than by importing the package, which would need its dependencies. The
      # whole string is matched (bash =~, not grep, which matches per line),
      # so a multi-line value cannot smuggle extra lines into GITHUB_OUTPUT.
      - name: Read version
        id: getversion
        run: |
          version="$(python3 -c 'import ast, pathlib; tree = ast.parse(pathlib.Path("pre_commit_bigfix/__init__.py").read_text()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(getattr(t, "id", None) == "__version__" for t in node.targets)))')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::unexpected version string in pre_commit_bigfix/__init__.py: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # Release only if this version has no tag yet.
      - name: Check whether v<version> is already tagged
        id: tagged
        env:
          VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          if git show-ref --tags --verify --quiet -- "refs/tags/v${VERSION}"; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already tagged - nothing to release"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} has no tag yet - will release"
          fi

      # Publish is decided on its own, by asking PyPI, not by the tag: an
      # upload that failed after the release was made (or a version released
      # before publishing was enabled) is still published by the next run.
      # PyPI is not asked at all while publishing is off.
      - name: Check whether PyPI needs this version
        id: pypi
        env:
          PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
          VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          if [ "${PYPI_PUBLISH}" != "true" ]; then
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
            echo "PYPI_PUBLISH is not 'true' - not publishing"
            exit 0
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/pre-commit-bigfix/${VERSION}/json")"
          case "$status" in
            200)
              echo "publish_needed=false" >> "$GITHUB_OUTPUT"
              echo "${VERSION} is already on PyPI"
              ;;
            404)
              echo "publish_needed=true" >> "$GITHUB_OUTPUT"
              echo "${VERSION} is not on PyPI yet - will publish"
              ;;
            *)
              echo "::error::unexpected HTTP ${status} from PyPI for ${VERSION}"
              exit 1
              ;;
          esac

  # The gates. Reusing the test workflow means a release is blocked by the
  # exact job that guards PRs, with no third-party wait-for-checks action and
  # no polling.
  test:
    name: Test
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/test_build.yaml # zizmor: ignore[self-repository] -- ./ is the documented local reusable-workflow form

  # PRs run pre-commit on the changed files only; a release also runs the
  # manual-stage hooks (zizmor, pyroma, validate-pyproject, pytest, ...) over
  # everything, as this workflow always has.
  pre-commit:
    name: pre-commit (all files, manual stage)
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Pre-Commit Environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: >-
            --color=always
            --all-files
            --hook-stage manual

  # Built once, here, with read-only access; release and publish both use
  # this artifact, so the files on the GitHub release and on PyPI are the
  # same files.
  build:
    name: Build distributions
    needs: [version, test, pre-commit]
    if: needs.version.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: install uv
        run: python -m pip install "uv==0.13.0"

      - name: uv build (wheel + sdist)
        run: uv build

      # `sha256sum -c SHA256SUMS.txt`-verifiable, and with no dist/ prefix in
      # it, so it checks out wherever the assets are downloaded to. Globs are
      # listed explicitly so the output file can never end up listing itself.
      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # long enough to "Re-run failed jobs" on a failed publish
          retention-days: 30

  release:
    name: Tag and Release
    needs: [version, build]
    if: needs.version.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release, and upload assets
    steps:
      # for RELEASE_NOTES.md only; nothing from the checkout is run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Release notes: this version's section of RELEASE_NOTES.md (from its
      # `## v<version>` heading to the next `## ` heading), or GitHub's
      # generated notes when there is none; then the checksums.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## v${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' RELEASE_NOTES.md > "$notes_file"
          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::warning::no '## v${VERSION}' section in RELEASE_NOTES.md; using generated notes"
            if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                  --method POST \
                  -f "tag_name=v${VERSION}" \
                  -f "target_commitish=${GITHUB_SHA}" \
                  --jq '.body' > "$notes_file"; then
              printf 'Release v%s\n' "${VERSION}" > "$notes_file"
            fi
          fi
          # SC2016: the backticks below are markdown code spans for the
          # release body, not command substitutions.
          # shellcheck disable=SC2016
          {
            printf '\n## SHA-256\n\n'
            printf 'Verify with `sha256sum -c SHA256SUMS.txt`:\n\n'
            printf '```\n'
            cat dist/SHA256SUMS.txt
            printf '```\n'
          } >> "$notes_file"
          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
          cat "$notes_file"

      # `gh release create --target` creates the tag itself, so this needs no
      # git push and the checkout above can stay credential-less. Idempotent:
      # when a re-run finds the release already made, it moves on to publish
      # rather than failing here. A version that is not plain X.Y.Z (2.1.0rc1)
      # is a pre-release and is not marked latest.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "release v${VERSION} already exists - leaving it as it is"
            exit 0
          fi
          prerelease=()
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            "${prerelease[@]}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt

  # Inert until all of these are true, so nothing can publish by accident:
  #   1. a PyPI trusted publisher exists for this repo with workflow name
  #      `tag_and_release.yaml` and environment name `pypi`, matching the
  #      `environment:` below (https://docs.pypi.org/trusted-publishers/)
  #   2. the repository variable PYPI_PUBLISH is set to `true`
  #   3. whatever protection rules the `pypi` environment carries have been
  #      satisfied - they gate this job, the only one that can upload
  # `uv publish` speaks OIDC natively given id-token: write, so there is no
  # long-lived API token to store. A failed upload is retried with "Re-run
  # failed jobs" (the release is not redone, and --check-url skips files PyPI
  # already has), or by dispatching this workflow on main, which publishes the
  # assets of the existing release when PyPI does not have the version.
  publish:
    name: Publish to PyPI
    needs: [version, release]
    # Runs after a successful release, or with no release at all when the
    # version was already released (publishing it now). Never after a failed
    # or skipped-by-failure release.
    if: >-
      !cancelled()
      && needs.version.outputs.publish_needed == 'true'
      && (needs.release.result == 'success'
          || (needs.release.result == 'skipped'
              && needs.version.outputs.release_needed != 'true'))
    runs-on: ubuntu-latest
    # The name must match the `Environment name` field of the PyPI trusted
    # publisher exactly: PyPI checks the `environment` claim in the OIDC token.
    environment: pypi
    permissions:
      contents: read # gh release download
      id-token: write # OIDC for trusted publishing
    steps:
      - name: Download the built distributions
        if: needs.version.outputs.release_needed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download the released distributions
        if: needs.version.outputs.release_needed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS.txt
          cd dist && sha256sum -c SHA256SUMS.txt

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: install uv
        run: python -m pip install "uv==0.13.0"

      - name: Publish to PyPI (trusted publishing)
        # the explicit globs keep SHA256SUMS.txt (also in dist/) out of the
        # upload; uv publish would otherwise take everything in dist/
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/*.whl dist/*.tar.gz
