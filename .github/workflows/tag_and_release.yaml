---
# Tags, releases and publishes on a version bump. Nothing here bumps the
# version: change `__version__` in pre_commit_bigfix/__init__.py in a PR, merge
# it to main, and this workflow does the rest (tag, build, checksums, GitHub
# Release, and - once deliberately enabled, see the publish step - PyPI).
name: Tag and Release

on:
  push:
    branches:
      - main
    paths:
      - "pre_commit_bigfix/__init__.py"
      - ".github/workflows/tag_and_release.yaml"
      - ".github/workflows/test_build.yaml"
  # a re-run path for when a release run failed after the version was already
  # merged; the tag check below still makes it a no-op if the tag exists
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # deliberately no cancel-in-progress: never kill a release mid-flight
  group: release-${{ github.ref }}

jobs:
  # Decides whether there is anything to do, so the jobs below can be skipped
  # outright. A push that does not bump the version gets a green, near-instant
  # run and no release.
  version:
    name: Check for an untagged version
    runs-on: ubuntu-latest
    # fork guard: a fork that pushes to its own main should not try to release
    if: github.repository == 'jgstew/pre-commit-bigfix'
    outputs:
      version: ${{ steps.getversion.outputs.version }}
      release_needed: ${{ steps.tagged.outputs.release_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history + tags: the tag check below needs every existing tag
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # `__version__` in pre_commit_bigfix/__init__.py is the single source of
      # truth (setup.cfg reads it with `attr:`). It is read with ast rather
      # than by importing the package, which would need its dependencies.
      - name: Read version
        id: getversion
        run: |
          version="$(python3 -c 'import ast, pathlib; tree = ast.parse(pathlib.Path("pre_commit_bigfix/__init__.py").read_text()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(getattr(t, "id", None) == "__version__" for t in node.targets)))')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z.]+)?$'; then
            echo "::error::unexpected version string in pre_commit_bigfix/__init__.py: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # Release only if this version has no tag yet. This is what makes the
      # workflow idempotent and safe to re-run.
      - name: Check whether v<version> is already tagged
        id: tagged
        env:
          VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          if git show-ref --tags --verify --quiet -- "refs/tags/v${VERSION}"; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already tagged - nothing to release"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} has no tag yet - will release"
          fi

  # The gates. Reusing the test workflow means a release is blocked by the
  # exact job that guards PRs, with no third-party wait-for-checks action and
  # no polling.
  test:
    name: Test
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/test_build.yaml # zizmor: ignore[self-repository] -- ./ is the documented local reusable-workflow form

  # PRs run pre-commit on the changed files only; a release also runs the
  # manual-stage hooks (zizmor, pyroma, validate-pyproject, pytest, ...) over
  # everything, as this workflow always has.
  pre-commit:
    name: pre-commit (all files, manual stage)
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache Pre-Commit Environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: >-
            --color=always
            --all-files
            --hook-stage manual

  release:
    name: Tag and Release
    needs: [version, test, pre-commit]
    runs-on: ubuntu-latest
    # Deliberately gates the whole release - tag, GitHub release, and PyPI
    # upload - not just the publish step, so an environment protection rule
    # (required reviewer, wait timer, branch restriction) stops a release
    # before the tag is cut rather than after. The name must match the
    # `Environment name` field of the PyPI trusted publisher exactly: PyPI
    # checks the `environment` claim in the OIDC token, and a mismatch fails
    # the publish.
    environment: pypi
    permissions:
      # contents: write - create the tag and the release, and upload assets.
      # id-token: write - OIDC for the PyPI trusted-publishing step at the end
      # of this job. Both live here rather than in a separate publish job so
      # the built dist/ does not have to be handed between jobs.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: install uv
        run: python -m pip install "uv==0.13.0"

      - name: uv build (wheel + sdist)
        run: uv build

      # `sha256sum -c SHA256SUMS.txt`-verifiable, and with no dist/ prefix in
      # it, so it checks out wherever the assets are downloaded to. Globs are
      # listed explicitly so the output file can never end up listing itself.
      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Release notes: this version's section of RELEASE_NOTES.md (from its
      # `## v<version>` heading to the next `## ` heading), or GitHub's
      # generated notes when there is none; then the checksums.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## v${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' RELEASE_NOTES.md > "$notes_file"
          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::warning::no '## v${VERSION}' section in RELEASE_NOTES.md; using generated notes"
            if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                  --method POST \
                  -f "tag_name=v${VERSION}" \
                  -f "target_commitish=${GITHUB_SHA}" \
                  --jq '.body' > "$notes_file"; then
              printf 'Release v%s\n' "${VERSION}" > "$notes_file"
            fi
          fi
          # SC2016: the backticks below are markdown code spans for the
          # release body, not command substitutions.
          # shellcheck disable=SC2016
          {
            printf '\n## SHA-256\n\n'
            printf 'Verify with `sha256sum -c SHA256SUMS.txt`:\n\n'
            printf '```\n'
            cat dist/SHA256SUMS.txt
            printf '```\n'
          } >> "$notes_file"
          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
          cat "$notes_file"

      # `gh release create --target` creates the tag itself, so this needs no
      # git push and the checkout above can stay credential-less.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt

      # Inert until all of these are true, so nothing can publish by accident:
      #   1. a PyPI trusted publisher exists for this repo with workflow name
      #      `tag_and_release.yaml` and environment name `pypi`, matching the
      #      `environment:` above (https://docs.pypi.org/trusted-publishers/)
      #   2. the repository variable PYPI_PUBLISH is set to `true`
      #      (Settings > Secrets and variables > Actions > Variables)
      #   3. whatever protection rules the `pypi` environment carries have been
      #      satisfied - those gate this entire job, tagging included
      # `uv publish` speaks OIDC natively given the id-token: write permission
      # above, so there is no long-lived API token to store. The release is
      # already created at this point: a failure here leaves the GitHub release
      # intact, and the upload is re-run by hand.
      - name: Publish to PyPI (trusted publishing)
        if: vars.PYPI_PUBLISH == 'true'
        # the explicit globs keep SHA256SUMS.txt (also in dist/) out of the
        # upload; uv publish would otherwise take everything in dist/
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
