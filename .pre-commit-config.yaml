---
# run on only items staged in git:  pre-commit
# automatically run on commit:      pre-commit install
# check all files in repo:          pre-commit run --all-files
# check all files in repo:          pre-commit run --all-files --hook-stage manual
# update all pre-commit hooks:      pre-commit autoupdate
# https://github.com/pre-commit/pre-commit-hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
        stages: [manual]
      - id: check-dependabot
        stages: [manual]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: https://github.com/DanielNoord/pydocstringformatter
    rev: v1.0.0
    hooks:
      - id: pydocstringformatter
        args: ["--max-summary-lines=2", "--linewrap-full-docstring"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        stages: [manual]

  - repo: https://github.com/regebro/pyroma
    rev: "5.1b1"
    hooks:
      - id: pyroma
        # Must be specified because of the default value in pyroma
        always_run: false
        files: |
          (?x)^(
              README.md|
              pyproject.toml|
              pre_commit_bigfix/__init__.py|
              setup.cfg|
              setup.py
          )$
        stages: [manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    # Find security issues in GitHub Actions CI/CD setups.
    rev: v1.27.0
    hooks:
      # Run the linter.
      - id: zizmor
        stages: [manual]

  - repo: meta
    hooks:
      - id: check-useless-excludes
        stages: [manual]
      - id: check-hooks-apply
        stages: [manual]

  # Local Hooks:
  # language: python -> pre-commit provisions an isolated venv, so bare `python`
  # always resolves (no dependence on a system `python` shim). Third-party
  # imports must be declared via additional_dependencies.
  - repo: local
    hooks:
      - id: check-bes-conventions-local
        name: check-bes-conventions-local
        entry: python pre_commit_bigfix/bigfix_bes_check_conventions.py
        language: python
        pass_filenames: True
        args: ["--auto-fix=no"]
        files: \.bes$
  # - repo: local
  #   hooks:
  #     - id: try-repo
  #       name: try-repo
  #       entry: pre-commit try-repo . --files tests/examples/example-test.bes
  #       language: system
  #       pass_filenames: False
  #       require_serial: True
  #       stages: [manual]

  - repo: https://github.com/christophmeissner/pytest-pre-commit
    rev: 1.0.0
    hooks:
      # see config in pyproject.toml
      - id: pytest
        pass_filenames: false
        always_run: true
        stages: [manual]
        additional_dependencies:
          - validate_bes_xml
