[metadata]
name = pre-commit-bigfix
version = attr: pre_commit_bigfix.__version__
author = JGStew
author_email = noreply@jgstew.com
description = pre-commit hooks for BigFix content
keywords = pre-commit hooks python bigfix bes
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/jgstew/pre-commit-bigfix
project_urls =
    Bug Tracker = https://github.com/jgstew/pre-commit-bigfix/issues
    Source = https://github.com/jgstew/pre-commit-bigfix
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers

[options]
package_dir =
    = .
packages = pre_commit_bigfix
python_requires = >=3.8
include_package_data = True
install_requires =
    # 1.1.5 is where prefetch.add_sha256_prefetch() arrived, which is what
    # bes-actionscript-validate-prefetch's --auto-fix-network calls.
    bigfix_prefetch >= 1.1.5
    lxml
    validate_bes_xml
    # bes-relevance-lint only. The marker is load-bearing: the analyzer needs
    # 3.11, this package still supports 3.8, and without it every hook here
    # would become uninstallable on the older interpreters. On <3.11 the hook
    # prints why it cannot run and exits 0 -- a config running on 3.8 has no
    # way to make it pass, so failing there would only be an unfixable build.
    bigfix-relevance-analyzer >= 1.9.0; python_version >= "3.11"

[options.package_data]
pre_commit_bigfix = schclass_data/*.schclass

[options.extras_require]
test =
    pytest

[options.entry_points]
console_scripts =
    bes-schema-validate = pre_commit_bigfix.bes_schema_validate:main
    # deprecated alias for bes-schema-validate (same function)
    validate-bes = pre_commit_bigfix.bes_schema_validate:main
    bes-conventions-check = pre_commit_bigfix.bes_conventions_check:main
    # deprecated alias for bes-conventions-check (same function)
    check-bes-conventions = pre_commit_bigfix.bes_conventions_check:main
    bes-actionscript-lint-schclass = pre_commit_bigfix.bes_actionscript_lint_schclass:main
    bes-actionscript-validate-prefetch = pre_commit_bigfix.bes_actionscript_validate_prefetch:main
    bes-actionscript-validate-script = pre_commit_bigfix.bes_actionscript_validate_script:main
    bes-relevance-lint = pre_commit_bigfix.bes_relevance_lint:main
